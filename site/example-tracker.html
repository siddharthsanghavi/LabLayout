/* ===== LabLayout theme ===== */
:root{--ink:#16181b;--paper:#f3f2ee;--line:#e3e1dc;--line2:#d2cfc8;--mut:#6b6f75;--acc:#f26b1d;--accd:#d95a10;--blue:#2d6cdf}

<header><h1 id="apptitle">Lab Storage Organizer</h1><span id="syncst"></span><button class="alt" id="seed">Test data</button><button class="alt" id="bCB" title="Colour-blind friendly colours">👁 Colour-blind</button><button class="alt" id="reset">Reset</button><button class="alt" id="bPeople">👥 People</button><button class="alt" id="bBackup">💾 Backup</button><button class="alt" id="bRestore">📂 Restore</button><button class="alt" id="bSync">☁ Sync</button><input type="file" id="restoref" accept=".json" hidden><datalist id="peoplelist"></datalist><button id="copy">Copy list</button></header>

 <section id="v-map" class="panel"><h2>Room map (top-down) — tap a section</h2>

<script>
/* Colour-blind mode: swaps red/green/orange/yellow for the Okabe-Ito palette, which stays distinct with protanopia, deuteranopia and tritanopia */
const CB_MAP={'#c62828':'#d55e00','#c0392b':'#d55e00','#a93226':'#d55e00','#b42318':'#d55e00','#2e8b57':'#009e73','#f26b1d':'#e69f00','#c77700':'#e69f00','#f08a24':'#e69f00','#f07c14':'#e69f00','#f39c35':'#e69f00','#c25a12':'#a86400','#f2c811':'#f0e442','#d4a017':'#f0e442','#f4c20d':'#f0e442','#14a3a3':'#56b4e9','#6a4cc2':'#cc79a7','#d6ecd9':'#d4e8f6'};
const cbSwap=t=>t&&t.replace(/#[0-9a-fA-F]{6}\b/g,h=>CB_MAP[h.toLowerCase()]||h);let CB_OBS=null;
function cbFix(el){if(el.nodeType!==1)return;[el,...el.querySelectorAll('*')].forEach(n=>{['fill','stroke','style','stop-color'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v&&/#[0-9a-fA-F]{6}/.test(v)){const w=cbSwap(v);if(w!==v)n.setAttribute(a,w)}})})}
function cbOn(){try{return localStorage.getItem('lablayout-cb')==='1'}catch(e){return false}}
function cbApply(on){document.querySelectorAll('style').forEach(s=>{if(s.dataset.cbOrig==null)s.dataset.cbOrig=s.textContent;s.textContent=on?cbSwap(s.dataset.cbOrig):s.dataset.cbOrig});
 document.documentElement.classList.toggle('cb',on);if(CB_OBS){CB_OBS.disconnect();CB_OBS=null}

 const data=j&&(j.format==='lablayout-tracker-backup'||j.format==='cribops-tracker-backup')?j.data:j;if(!data||!data.items){toast('Not a LabLayout backup');return}
 const m=document.getElementById('modal'),b=m.querySelector('.mbody');openZ=null;const cnt=Object.values(data.items).reduce((a,l)=>a+l.length,0);
 b.innerHTML=`<h3>Restore backup?</h3><p>${esc(f.name)}<br><span class="hint">${j.exported?'Saved '+new Date(j.exported).toLocaleString()+' · ':''}${cnt} items · ${(data.out||[]).length} checked out · ${(data.log||[]).length} log entries</span></p>${j.room&&j.room!==CONFIG.id?`<div class="mvq">This backup is from a different room (<b>${esc(j.title||j.room)}</b>). Items in drawers this room doesn't have will go to Unsorted.</div>`:''}<p class="hint">This replaces everything currently in this tracker${syncCfg()?' — and on every synced device':''}. Download a backup first if you're unsure.</p><div class="acts"><button class="bad" id="rsOk">Replace current data</button><button class="alt" onclick="closeDrawer()">Cancel</button></div>`;
 m.classList.add('on');b.querySelector('#rsOk').onclick=()=>{const rev=S._rev;S=data;S._rev=rev;normalize();syncDirty=true;save();build();buildTabs();closeDrawer();toast('Backup restored')}};

/* ===== shared sync (Supabase table) ===== */
let syncDirty=false,syncT=null,syncBusy=false,syncTimer=null;
const SYNC_KEY='lablayout-sync-'+(CONFIG.storageKey||CONFIG.id);
function syncCfg(){let c=null;try{c=JSON.parse(localStorage.getItem(SYNC_KEY))}catch(e){}if(c&&c.off)return null;c=c||CONFIG.sync;return c&&c.url&&c.key?{room:CONFIG.storageKey||CONFIG.id,...c,url:c.url.replace(/\/+$/,'')}:null}
function syncSt(t,err){const e=document.getElementById('syncst');if(e){e.textContent=t;e.classList.toggle('err',!!err)}}
async function sreq(c,method,qs,body,prefer){const r=await fetch(`${c.url}/rest/v1/lablayout_rooms${qs}`,{method,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));const t=await r.text();return t?JSON.parse(t):null}
const rq=c=>'?id=eq.'+encodeURIComponent(c.room);
function payload(){const d=JSON.parse(JSON.stringify(S));delete d._rev;return d}
function mergeInto(local,remote){const key=x=>x.at+'|'+x.who+'|'+x.action+'|'+x.t;const seen=new Set();
 local.log=[...local.log,...(remote.log||[])].filter(x=>{const k=key(x);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.at-a.at).slice(0,1000);
 (remote.people||[]).forEach(p=>{if(!local.people.some(q=>q.toLowerCase()===p.toLowerCase()))local.people.push(p)});local.n=Math.max(local.n||0,remote.n||0)}
function adopt(row){const keepOpen=openZ;S=row.data;S._rev=row.rev;normalize();try{localStorage.setItem(CONFIG.storageKey||('lablayout-'+CONFIG.id),JSON.stringify(S))}catch(e){}build();buildTabs();if(keepOpen&&S.items[keepOpen])openDrawer(keepOpen)}
async function syncNow(){const c=syncCfg();if(!c||syncBusy)return;syncBusy=true;
 try{for(let tries=0;tries<3;tries++){
  const rows=await sreq(c,'GET',rq(c)+'&select=rev,data');const row=rows&&rows[0];
  if(!row){if(!syncDirty&&S._rev){/* remote was deleted: re-create from local */}const ins=await sreq(c,'POST','',{id:c.room,rev:1,data:payload()},'return=representation');S._rev=ins[0].rev;syncDirty=false;break}
  if(!syncDirty){if(row.rev!==S._rev)adopt(row);break}
  if(row.rev!==S._rev)mergeInto(S,row.data);
  const up=await sreq(c,'PATCH',rq(c)+'&rev=eq.'+row.rev,{rev:row.rev+1,data:payload(),updated_at:new Date().toISOString()},'return=representation');
  if(up&&up.length){S._rev=up[0].rev;syncDirty=false;try{localStorage.setItem(CONFIG.storageKey||('lablayout-'+CONFIG.id),JSON.stringify(S))}catch(e){}if(row.rev!==S._rev-1)render();break}}
  syncSt('☁ synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))}
 catch(err){syncSt('☁ offline — changes saved here, will retry',true);console.warn('sync',err)}finally{syncBusy=false}}
window.syncPush=()=>{if(!syncCfg())return;syncDirty=true;clearTimeout(syncT);syncT=setTimeout(syncNow,1200)};
function syncStart(){clearInterval(syncTimer);if(!syncCfg()){syncSt('');return}syncSt('☁ connecting…');syncNow();syncTimer=setInterval(()=>{if(!document.hidden)syncNow()},15000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
document.getElementById('bSync').onclick=()=>{const m=document.getElementById('modal'),b=m.querySelector('.mbody');openZ=null;const c=syncCfg()||{};
 b.innerHTML=`<h3>☁ Shared inventory</h3><p class="hint">Connect this tracker to a Supabase project so every phone and computer shares one inventory. Setup steps are in the LabLayout README. Without this, data stays in this browser only.</p>
 <form class="itf" id="syf"><label>Supabase project URL<input id="syu" value="${esc(c.url||'')}" placeholder="https://xxxx.supabase.co"></label><label>Anon (public) key<input id="syk" value="${esc(c.key||'')}" placeholder="eyJ…"></label><label>Room ID (same on every device)<input id="syr" value="${esc(c.room||CONFIG.storageKey||CONFIG.id)}"></label>
 <div class="acts"><button>Connect</button>${syncCfg()?'<button type="button" class="bad" id="syoff">Disconnect this device</button>':''}<button type="button" class="alt" onclick="closeDrawer()">Cancel</button></div></form><p class="hint">${syncCfg()?'Status: '+esc(document.getElementById('syncst').textContent||'connected'):'Not connected. Joining a room that already has data replaces this device2019s copy with the shared one.'}</p>
 <p class="hint">If two people edit at the same moment, the activity log keeps both people's entries, and the last save wins for everything else.</p>`;
 m.classList.add('on');
 b.querySelector('#syf').onsubmit=async e=>{e.preventDefault();const n={url:b.querySelector('#syu').value.trim(),key:b.querySelector('#syk').value.trim(),room:b.querySelector('#syr').value.trim()||CONFIG.id};if(!n.url||!n.key){toast('URL and key are required');return}
  try{await sreq({...n,url:n.url.replace(/\/+$/,'')},'GET','?select=id&limit=1')}catch(err){toast('Could not connect: '+err.message.slice(0,80));return}
  try{localStorage.setItem(SYNC_KEY,JSON.stringify(n))}catch(err){}S._rev=undefined;syncDirty=false;closeDrawer();syncStart();toast('Connected — syncing')};
 const off=b.querySelector('#syoff');if(off)off.onclick=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify({off:true}))}catch(err){}syncStart();closeDrawer();toast('Disconnected — this device keeps its own copy')}};

drawMap();build();buildTabs();syncStart();

{const b=document.getElementById('bCB');if(window.parent!==window)b.style.display='none';const upd=()=>{b.textContent=cbOn()?'👁 Colour-blind: on':'👁 Colour-blind';};upd();if(cbOn())cbApply(true);b.onclick=()=>{try{localStorage.setItem('lablayout-cb',cbOn()?'0':'1')}catch(e){}cbApply(cbOn());upd();if(!cbOn())location.reload()}}
</script></body></html>
